[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-alarm"
version = "1.0.0"
description = "A simple CLI alarm clock with background daemon capabilities for Windows"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
simple-alarm = "alarm:main"

[tool.setuptools]
py-modules = ["alarm"]
